<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Панель аттестатора</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .result-card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .score { font-size: 1.5rem; font-weight: bold; color: #B8A04A; }
    .criteria { margin-top: 0.5rem; padding-left: 1.5rem; }
    .criteria li { margin: 0.25rem 0; }
    textarea { width: 100%; min-height: 60px; margin: 0.5rem 0; }
    button { background: #B8A04A; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📋 Проверка аттестаций</h1>
  <input type="text" id="resultId" placeholder="Введите ID результата" style="width:200px;padding:0.5rem;margin-right:0.5rem">
  <button onclick="loadResult()">Загрузить</button>
  
  <div id="review-area" style="display:none;margin-top:2rem">
    <div class="result-card">
      <h3><span id="review-name"></span> — <span id="review-position"></span></h3>
      <p>Дата: <span id="review-date"></span> | Авто-баллы: <span class="score" id="review-auto-score"></span></p>
    </div>
    <div id="questions-list"></div>
    <button onclick="saveReview()" style="margin-top:1rem;background:#2E7D32">💾 Сохранить оценку</button>
  </div>

  <script>
    async function loadResult() {
      const id = document.getElementById('resultId').value;
      if (!id) return alert('Введите ID');
      
      const res = await fetch(`/api/result/${id}`);
      if (!res.ok) return alert('Результат не найден');
      
      const data = await res.json();
      document.getElementById('review-name').textContent = data.userName;
      document.getElementById('review-position').textContent = data.position;
      document.getElementById('review-date').textContent = new Date(data.submittedAt).toLocaleString('ru-RU');
      document.getElementById('review-auto-score').textContent = `${data.autoScore.total}/${data.autoScore.max}`;
      
      const list = document.getElementById('questions-list');
      list.innerHTML = data.questionsWithAnswers.map(q => `
        <div class="result-card">
          <strong>${q.text}</strong> [${q.points} балл${q.points===1?'':'а'}]<br>
          <em>Ответ сотрудника:</em><br>
          <div style="background:#f9f9f9;padding:0.5rem;margin:0.5rem 0;border-radius:4px">${q.userAnswer || '—'}</div>
          ${q.criteria ? `
            <em>Критерии оценки:</em>
            <ul class="criteria">
              ${q.criteria.map(c => `<li><label><input type="checkbox" data-cid="${c.id}" data-weight="${c.weight}"> ${c.text} (${c.weight} балл${c.weight===1?'':'а'})</label></li>`).join('')}
            </ul>
            <textarea placeholder="Комментарий аттестатора..." id="comment-${q.id}"></textarea>
          ` : ''}
        </div>
      `).join('');
      
      document.getElementById('review-area').style.display = 'block';
    }
    
    async function saveReview() {
      const id = document.getElementById('resultId').value;
      const criteriaScores = {};
      document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
        criteriaScores[cb.dataset.cid] = parseFloat(cb.dataset.weight);
      });
      
      const comments = {};
      document.querySelectorAll('textarea').forEach(ta => {
        if (ta.value.trim()) comments[ta.id.replace('comment-', '')] = ta.value.trim();
      });
      
      await fetch(`/api/review/${id}`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ criteriaScores, comments, reviewedAt: new Date().toISOString() })
      });
      
      alert('✅ Оценка сохранена');
    }
  </script>
</body>
</html>
